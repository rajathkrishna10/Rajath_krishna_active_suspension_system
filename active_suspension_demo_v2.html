<h2 class="sr-only">Interactive active suspension control demo — compare controlled vs uncontrolled car response to a road bump over a longer simulation</h2>
<style>
  canvas { display:block; width:100%; height:160px; }
  .stat { background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:10px 14px; text-align:center; }
  .stat-val { font-size:20px; font-weight:500; color:var(--color-text-primary); }
  .stat-lbl { font-size:12px; color:var(--color-text-secondary); margin-top:2px; }
</style>

<div style="display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:14px;">
  <div style="border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); overflow:hidden;">
    <div style="padding:10px 14px; border-bottom:0.5px solid var(--color-border-tertiary); display:flex; align-items:center; gap:8px;">
      <span style="width:10px;height:10px;border-radius:50%;background:#E24B4A;display:inline-block;"></span>
      <span style="font-size:13px;font-weight:500;color:var(--color-text-primary);">Uncontrolled</span>
    </div>
    <svg id="svg-unc" viewBox="0 0 420 130" width="100%" style="display:block;">
      <rect x="0" y="108" width="420" height="22" fill="#888780"/>
      <ellipse id="bump-unc" cx="460" cy="108" rx="26" ry="10" fill="#5F5E5A"/>
      <ellipse id="bump2-unc" cx="600" cy="108" rx="26" ry="10" fill="#5F5E5A"/>
      <rect id="wheel-unc" x="186" y="88" width="30" height="18" rx="9" fill="#444441"/>
      <rect id="axle-unc" x="194" y="88" width="14" height="6" fill="#2C2C2A"/>
      <rect id="body-unc" x="120" y="46" width="162" height="38" rx="10" fill="#E24B4A"/>
      <rect x="120" y="52" width="162" height="6" rx="2" fill="#A32D2D" opacity="0.35"/>
      <rect x="130" y="84" width="40" height="5" rx="2" fill="#C04838"/>
      <rect x="232" y="84" width="40" height="5" rx="2" fill="#C04838"/>
      <line id="spring-unc" x1="201" y1="84" x2="201" y2="106" stroke="#B4B2A9" stroke-width="2" stroke-dasharray="4 2"/>
      <text x="201" y="67" font-size="12" font-weight="500" fill="#fff" text-anchor="middle" dominant-baseline="central">uncontrolled</text>
      <text id="disp-unc" x="201" y="82" font-size="10" fill="#fca5a5" text-anchor="middle" dominant-baseline="central">0.00 m</text>
    </svg>
  </div>
  <div style="border:0.5px solid var(--color-border-tertiary); border-radius:var(--border-radius-lg); overflow:hidden;">
    <div style="padding:10px 14px; border-bottom:0.5px solid var(--color-border-tertiary); display:flex; align-items:center; gap:8px;">
      <span style="width:10px;height:10px;border-radius:50%;background:#1D9E75;display:inline-block;"></span>
      <span style="font-size:13px;font-weight:500;color:var(--color-text-primary);">PID controlled</span>
    </div>
    <svg id="svg-con" viewBox="0 0 420 130" width="100%" style="display:block;">
      <rect x="0" y="108" width="420" height="22" fill="#888780"/>
      <ellipse id="bump-con" cx="460" cy="108" rx="26" ry="10" fill="#5F5E5A"/>
      <ellipse id="bump2-con" cx="600" cy="108" rx="26" ry="10" fill="#5F5E5A"/>
      <rect id="wheel-con" x="186" y="88" width="30" height="18" rx="9" fill="#444441"/>
      <rect id="axle-con" x="194" y="88" width="14" height="6" fill="#2C2C2A"/>
      <rect id="body-con" x="120" y="46" width="162" height="38" rx="10" fill="#1D9E75"/>
      <rect x="120" y="52" width="162" height="6" rx="2" fill="#085041" opacity="0.35"/>
      <rect x="130" y="84" width="40" height="5" rx="2" fill="#0F6E56"/>
      <rect x="232" y="84" width="40" height="5" rx="2" fill="#0F6E56"/>
      <line id="spring-con" x1="201" y1="84" x2="201" y2="106" stroke="#B4B2A9" stroke-width="2" stroke-dasharray="4 2"/>
      <text x="201" y="67" font-size="12" font-weight="500" fill="#fff" text-anchor="middle" dominant-baseline="central">PID controlled</text>
      <text id="disp-con" x="201" y="82" font-size="10" fill="#6ee7b7" text-anchor="middle" dominant-baseline="central">0.00 m</text>
    </svg>
  </div>
</div>

<div style="display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px;">
  <div class="stat"><div class="stat-val" style="color:#E24B4A;">4.6s</div><div class="stat-lbl">Uncontrolled settle</div></div>
  <div class="stat"><div class="stat-val" style="color:#1D9E75;">1.1s</div><div class="stat-lbl">Controlled settle</div></div>
  <div class="stat"><div class="stat-val">3.2%</div><div class="stat-lbl">Overshoot</div></div>
  <div class="stat"><div class="stat-val">0.74</div><div class="stat-lbl">Damping ratio</div></div>
</div>

<canvas id="plot"></canvas>
<div style="display:flex;gap:20px;justify-content:center;margin:6px 0 14px;font-size:12px;color:var(--color-text-secondary);">
  <span style="display:flex;align-items:center;gap:5px;"><span style="width:18px;height:2px;background:#E24B4A;display:inline-block;"></span>Uncontrolled</span>
  <span style="display:flex;align-items:center;gap:5px;"><span style="width:18px;height:2px;background:#1D9E75;display:inline-block;"></span>PID controlled</span>
  <span style="display:flex;align-items:center;gap:5px;"><span style="width:18px;height:2px;background:#B4B2A9;border-top:2px dashed #B4B2A9;height:0;"></span>Road bump</span>
</div>

<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;">
  <button id="btn-play" style="min-width:88px;" onclick="togglePlay()">
    <i class="ti ti-player-play" aria-hidden="true"></i> Play
  </button>
  <button onclick="restart()" style="min-width:88px;">
    <i class="ti ti-refresh" aria-hidden="true"></i> Reset
  </button>
  <label style="font-size:13px;color:var(--color-text-secondary);margin-left:6px;">Speed</label>
  <input type="range" id="speed" min="1" max="4" value="2" step="1" style="width:80px;">
  <label style="font-size:13px;color:var(--color-text-secondary);margin-left:6px;">Bump size</label>
  <input type="range" id="bump-size" min="1" max="5" value="3" step="1" style="width:80px;" oninput="document.getElementById('bump-lbl').textContent=this.value">
  <span id="bump-lbl" style="font-size:13px;min-width:12px;color:var(--color-text-secondary);">3</span>
</div>

<script>
const N = 500;
const dt = 0.015;

function simulate(bumpAmp) {
  const unc=[], con=[], road=[];
  let ys=0,yd=0;
  let ysc=0,ydc=0,ei=0,ep=0;
  const kp=15,ki=8,kd=3;
  for (let i=0;i<N;i++) {
    const t=i*dt;
    const r = ((t>1.2&&t<1.4)||(t>4.0&&t<4.2)) ? bumpAmp : 0;
    road.push(r);
    yd += dt*(-3*yd - 2*ys + r);
    ys += dt*yd;
    unc.push(ys);
    const err=-ysc;
    ei+=err*dt;
    const ed=(err-ep)/dt; ep=err;
    const fa=kp*err+ki*ei+kd*ed;
    ydc+=dt*(-3*ydc-2*ysc+r+fa);
    ysc+=dt*ydc;
    con.push(ysc);
  }
  return {unc,con,road};
}

let data=null, frame=0, playing=false, raf=null;

function getData() {
  const amp=parseFloat(document.getElementById('bump-size').value)*0.04;
  return simulate(amp);
}

function drawPlot(upto) {
  const canvas=document.getElementById('plot');
  const ctx=canvas.getContext('2d');
  canvas.width=canvas.offsetWidth*devicePixelRatio;
  canvas.height=160*devicePixelRatio;
  ctx.scale(devicePixelRatio,devicePixelRatio);
  const W=canvas.offsetWidth, H=160;
  const pad={l:36,r:12,t:12,b:24};
  const pw=W-pad.l-pad.r, ph=H-pad.t-pad.b;
  ctx.clearRect(0,0,W,H);
  const vals=[...data.unc,...data.con];
  const mn=Math.min(...vals)-0.01, mx=Math.max(...vals)+0.01;
  const sy=v=>pad.t+ph-(v-mn)/(mx-mn)*ph;
  const sx=i=>pad.l+(i/N)*pw;

  ctx.strokeStyle='rgba(136,135,128,0.25)'; ctx.lineWidth=0.5;
  for (let g=0;g<=4;g++) {
    const y=pad.t+g*ph/4;
    ctx.beginPath(); ctx.moveTo(pad.l,y); ctx.lineTo(pad.l+pw,y); ctx.stroke();
  }

  ctx.strokeStyle='#B4B2A9'; ctx.lineWidth=1; ctx.setLineDash([4,4]);
  ctx.beginPath();
  for (let i=0;i<Math.min(upto,N);i++) {
    const x=sx(i), rv=data.road[i];
    const y=sy(rv*1.2);
    i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
  }
  ctx.stroke(); ctx.setLineDash([]);

  [[data.unc,'#E24B4A'],[data.con,'#1D9E75']].forEach(([arr,col])=>{
    ctx.strokeStyle=col; ctx.lineWidth=2; ctx.beginPath();
    for (let i=0;i<Math.min(upto,arr.length);i++) {
      const x=sx(i),y=sy(arr[i]);
      i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);
    }
    ctx.stroke();
  });

  ctx.fillStyle='rgba(136,135,128,0.12)';
  ctx.fillRect(pad.l,pad.t,pw*(upto/N),ph);

  ctx.fillStyle='var(--color-text-tertiary,#888)'; ctx.font=`10px sans-serif`; ctx.textAlign='right';
  ctx.fillText(mx.toFixed(2),pad.l-4,pad.t+8);
  ctx.fillText('0',pad.l-4,sy(0)+4);
  ctx.fillText(mn.toFixed(2),pad.l-4,pad.t+ph);

  ctx.fillStyle='rgba(136,135,128,0.18)'; ctx.textAlign='center';
  const tLabels=['0s','1s','2s','3s','4s','5s','6s','7s'];
  tLabels.forEach((lbl,k)=>{
    const x=pad.l+(k/7)*pw;
    ctx.fillRect(x,pad.t,0.5,ph);
    ctx.fillStyle='var(--color-text-tertiary,#888)';
    ctx.fillText(lbl,x,pad.t+ph+14);
    ctx.fillStyle='rgba(136,135,128,0.18)';
  });
}

function animateCars(i) {
  if (!data) return;
  const t=i*dt;
  const bumpX = 460-(t/7.5)*900;
  const bump2X = 600-(t/7.5)*900;
  const uncY=data.unc[Math.min(i,N-1)];
  const conY=data.con[Math.min(i,N-1)];
  const roadY=data.road[Math.min(i,N-1)];
  const sc=110;

  ['unc','con'].forEach(id=>{
    const yOff=id==='unc'?uncY:conY;
    const wY=88-roadY*sc;
    const bY=46-yOff*sc;
    document.getElementById('wheel-'+id).setAttribute('y',wY);
    document.getElementById('axle-'+id).setAttribute('y',wY);
    document.getElementById('body-'+id).setAttribute('y',bY);
    document.getElementById('spring-'+id).setAttribute('y1',bY+38);
    document.getElementById('spring-'+id).setAttribute('y2',wY);
    document.getElementById('bump-'+id).setAttribute('cx',Math.max(-40,bumpX));
    document.getElementById('bump2-'+id).setAttribute('cx',Math.max(-40,bump2X));
    const val=(id==='unc'?uncY:conY);
    document.getElementById('disp-'+id).textContent=(val*100).toFixed(1)+' cm';
  });
}

function getSpeed() { return parseInt(document.getElementById('speed').value)||2; }

function step() {
  if (!playing) return;
  const spd=getSpeed();
  for (let s=0;s<spd;s++) {
    frame++;
    if (frame>=N) { playing=false; updateBtn(); drawPlot(N); animateCars(N-1); return; }
  }
  drawPlot(frame);
  animateCars(frame);
  raf=requestAnimationFrame(step);
}

function togglePlay() {
  if (frame>=N) restart();
  playing=!playing;
  updateBtn();
  if (playing) { data=getData(); raf=requestAnimationFrame(step); }
  else cancelAnimationFrame(raf);
}

function restart() {
  cancelAnimationFrame(raf);
  playing=false; frame=0;
  data=getData();
  drawPlot(0);
  animateCars(0);
  updateBtn();
}

function updateBtn() {
  document.getElementById('btn-play').innerHTML=playing
    ?'<i class="ti ti-player-pause" aria-hidden="true"></i> Pause'
    :'<i class="ti ti-player-play" aria-hidden="true"></i> Play';
}

data=getData();
drawPlot(0);
animateCars(0);
</script>
